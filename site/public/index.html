<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>veldr — Terminal-first, multi-machine, agent-native IDE</title>
    <meta name="description" content="A terminal-first, multi-machine, agent-native web and desktop IDE built on herdr-core." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0e12;
        --panel: #131720;
        --border: #232a38;
        --text: #e6eaf2;
        --muted: #939db2;
        --accent: #6ea8fe;
        --code: #0f131b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 0%, #161d2b 0%, var(--bg) 60%);
        color: var(--text);
        font:
          15px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 640px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      .cmd {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--code);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13.5px;
        overflow-x: auto;
      }
      .cmd code {
        white-space: nowrap;
        color: var(--text);
      }
      button {
        flex-shrink: 0;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        color: var(--text);
        border-color: var(--accent);
      }
      nav {
        margin-top: 22px;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        font-size: 14px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>veldr</h1>
      <p>Terminal-first, multi-machine, agent-native web &amp; desktop IDE.</p>
      <div class="cmd">
        <code id="install-cmd">curl -fsSL https://veldr.app/cli/install.sh | sh</code>
        <button type="button" id="copy-btn">Copy</button>
      </div>
      <nav>
        <a href="https://github.com/davidliyutong/veldr/releases/latest">Desktop &amp; Release Downloads</a>
        <a href="https://github.com/davidliyutong/veldr">GitHub Repository</a>
        <a href="/cli/install.sh">install.sh</a>
      </nav>
    </main>
    <script>
      document.getElementById('copy-btn')?.addEventListener('click', async function () {
        const text = document.getElementById('install-cmd')?.textContent ?? '';
        try {
          await navigator.clipboard.writeText(text);
          this.textContent = 'Copied';
          setTimeout(() => (this.textContent = 'Copy'), 1500);
        } catch {}
      });
    </script>
  </body>
</html>
