name: release

on:
  push:
    tags: ['v*']

# Build jobs read the repository; only `publish` writes the release.
permissions:
  contents: read

env:
  # Where this release serves its assets: machines download their platform's archive and the core SHA256SUMS from there.
  RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}

jobs:
  encoder:
    uses: ./.github/workflows/encoder.yml
    with:
      cache: false

  # The cores (each the core and the machine side of its platform, musl's
  # too), packaged with their licenses; SHA256SUMS of the archives
  # and the executables in them.
  archives:
    runs-on: ubuntu-24.04
    needs: encoder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            backend/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: make deps
      - run: make check
      - run: pnpm -C backend test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: encoder-*
          path: dist/ffmpeg
      - name: Place the video encoders
        run: for d in dist/ffmpeg/encoder-*; do mv "$d" "dist/ffmpeg/${d#dist/ffmpeg/encoder-}"; done
      - name: Build
        run: scripts/build.sh
        env:
          VERSION: ${{ github.ref_name }}
          TARGETS: linux/amd64 linux/arm64 linux/amd64-musl linux/arm64-musl darwin/amd64 darwin/arm64
          REQUIRE_ENCODER: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: dist/release/*.tar.gz
          if-no-files-found: error

  # The desktop app's installers, each built on its own system: macOS DMG
  # and zip (x64 on the arm64 runner, with the Intel Electron and
  # node-pty's Intel prebuild), the Windows setup, Linux AppImage and deb (each
  # on a runner of its architecture: node-pty is built there by pnpm
  # install). Everything is built without any secret; only the
  # Package step, which runs electron-builder alone, gets the optional macOS
  # Developer ID certificate and notarization credentials (ad hoc without
  # them; Windows and Linux are not signed).
  # Each app (but Windows's) carries its own platform's executable from
  # the archives (the release's, so that the manifest names it).
  desktop:
    needs: [encoder, archives]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, platform: mac, arch: arm64 }
          - { os: macos-26, platform: mac, arch: x64 }
          - { os: windows-2025, platform: win, arch: x64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            backend/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: encoder-*
          path: dist/ffmpeg
      - name: Place the video encoders
        run: for d in dist/ffmpeg/encoder-*; do mv "$d" "dist/ffmpeg/${d#dist/ffmpeg/encoder-}"; done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ matrix.platform != 'win' }}
        with:
          name: archives
          path: dist/archives
      - name: The app's own executable
        if: ${{ matrix.platform != 'win' }}
        run: |
          slug=$(sed -n "s/^export const SLUG = '\(.*\)';$/\1/p" backend/shared/lib/brand.ts)
          os=${{ matrix.platform == 'mac' && 'darwin' || 'linux' }}
          key=$os-${ARCH/x64/amd64}
          mkdir -p dist/executables
          tar -xzf "dist/archives/$slug-$key.tar.gz" -O "$slug-$key/$slug" > "dist/executables/$slug-$key"
      - run: scripts/desktop.sh build
        env:
          REQUIRE_ENCODER: 1
          EXECUTABLES: ${{ matrix.platform != 'win' && 'dist/executables' || '' }}
      - name: Package
        run: scripts/desktop.sh dist
        env:
          SKIP_BUILD: 1
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_SIGN_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_SIGN_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.MACOS_NOTARY_APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.MACOS_NOTARY_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_NOTARY_PASSWORD || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.deb
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs: [archives, desktop]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/release
          merge-multiple: true
      # The release's files, the archives and the installers, and the
      # executables in the archives (<slug>-<platform>/<slug>, which the
      # cores check their machines' builds against).
      - name: Checksums
        run: |
          slug=$(sed -n "s/^export const SLUG = '\(.*\)';$/\1/p" backend/shared/lib/brand.ts)
          cd dist/release
          shopt -s nullglob
          ls *.tar.gz *.dmg *.zip *.exe *.AppImage *.deb > ../assets
          {
            shasum -a 256 $(cat ../assets)
            for a in *.tar.gz; do
              n=${a%.tar.gz}
              echo "$(tar -xzf "$a" -O "$n/$slug" | shasum -a 256 | cut -d' ' -f1)  $n/$slug"
            done
          } > SHA256SUMS
          cat SHA256SUMS
      # GitHub stores attestations for public repositories (private ones need
      # GitHub Enterprise Cloud); a private repository releases without
      # provenance.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: dist/release/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" $(sed 's|^|dist/release/|' dist/assets) dist/release/SHA256SUMS --notes-file notes.md --verify-tag
