name: release

on:
  push:
    tags: ['v*']

# Build jobs read the repository; only `publish` writes the release.
permissions:
  contents: read

jobs:
  encoder:
    uses: ./.github/workflows/encoder.yml
    with:
      cache: false

  archives:
    runs-on: ubuntu-24.04
    needs: encoder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - run: make deps
      - run: make check
      - run: go test ./...
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: encoder-*
          path: dist/ffmpeg
      - name: Place the video encoders
        run: for d in dist/ffmpeg/encoder-*; do mv "$d" "dist/ffmpeg/${d#dist/ffmpeg/encoder-}"; done
      - name: Build
        run: scripts/build.sh
        env:
          VERSION: ${{ github.ref_name }}
          TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
          REQUIRE_ENCODER: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: dist/release/*.tar.gz
          if-no-files-found: error

  # Ad-hoc signed macOS DMGs; electron-builder packages x64 on the arm64
  # runner with the Intel Electron and a cross-compiled core.
  desktop:
    runs-on: macos-latest
    needs: encoder
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: encoder-*
          path: dist/ffmpeg
      - name: Place the video encoders
        run: for d in dist/ffmpeg/encoder-*; do mv "$d" "dist/ffmpeg/${d#dist/ffmpeg/encoder-}"; done
      - run: make desktop-dmg
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
          REQUIRE_ENCODER: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.arch }}
          path: dist/desktop/*.dmg
          if-no-files-found: error

  # The macOS application (arm64, the runner's architecture), zipped. It is
  # built and tested without any secret and signed ad hoc; with the
  # optional MACOS_* secrets the step "Sign and notarize", the only one that
  # sees them, signs it again with a Developer ID certificate and notarizes
  # it.
  macos-app:
    runs-on: macos-26
    needs: encoder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: encoder-*
          path: dist/ffmpeg
      - name: Place the video encoders
        run: for d in dist/ffmpeg/encoder-*; do mv "$d" "dist/ffmpeg/${d#dist/ffmpeg/encoder-}"; done
      - run: brew install xcodegen
      - run: make macos-test
      - run: make macos-app
        env:
          VERSION: ${{ github.ref_name }}
          REQUIRE_ENCODER: 1
      # A keychain of this step with the certificate (base64 .p12) and, when
      # given, notarytool's credentials as the profile scripts/macos-app.sh
      # uses; it is deleted when the step ends.
      - name: Sign and notarize
        env:
          SIGN_CERTIFICATE: ${{ secrets.MACOS_SIGN_CERTIFICATE }}
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [[ -z "$SIGN_CERTIFICATE" || -z "$SIGN_IDENTITY" ]]; then
            echo "No signing certificate: the application stays signed ad hoc."
            exit 0
          fi
          kc="$RUNNER_TEMP/sign.keychain-db"
          p12="$RUNNER_TEMP/sign.p12"
          trap 'rm -f "$p12"; security delete-keychain "$kc" || true' EXIT
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security default-keychain -s "$kc"
          security list-keychains -d user -s "$kc"
          printf '%s' "$SIGN_CERTIFICATE" | base64 --decode > "$p12"
          security import "$p12" -k "$kc" -P "$SIGN_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          if [[ -n "$NOTARY_APPLE_ID" ]]; then
            xcrun notarytool store-credentials release --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
            export NOTARY_PROFILE=release
          fi
          scripts/macos-app.sh sign
      - name: Archive
        run: |
          name=$(sed -n 's/^[[:space:]]*Name = "\(.*\)"$/\1/p' internal/brand/brand.go)
          ditto -c -k --keepParent "dist/macos/$name.app" "dist/macos/$name-${GITHUB_REF_NAME#v}-mac-native-arm64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          path: dist/macos/*.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs: [archives, desktop, macos-app]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/release
          merge-multiple: true
      - name: Checksums
        run: cd dist/release && shasum -a 256 *.tar.gz *.dmg *.zip > SHA256SUMS && cat SHA256SUMS
      # GitHub stores attestations for public repositories (private ones need
      # GitHub Enterprise Cloud); a private repository releases without
      # provenance.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: dist/release/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/release/*.tar.gz dist/release/*.dmg dist/release/*.zip dist/release/SHA256SUMS --notes-file notes.md --verify-tag
