name: release

on:
  push:
    tags: ['v*']

# Build jobs read the repository; only `publish` writes the release.
permissions:
  contents: read

env:
  # Where this release serves its assets: machines download their platform's archive and the hub SHA256SUMS from there.
  RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}

jobs:
  # Stage 1: Full-featured headless Bun executables for all 6 POSIX platforms
  # (with pinned encoders, herdr-core, gui-helper, gpupick, web UI and VS Code
  # bridge embedded), packaged with licenses and SHA256SUMS, plus the Windows
  # hub executable for Stage 2's Windows desktop installer.
  archives:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            backend/pnpm-lock.yaml
            site/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: make deps
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: make check
      - run: pnpm -C backend test
      - name: Stage 1 build
        run: scripts/build.sh
        env:
          VERSION: ${{ github.ref_name }}
          WITH_WINDOWS: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-windows
          path: dist/*-windows-amd64.exe
          if-no-files-found: error

  # Stage 2: The Electron desktop installers on each system, bundling all 6
  # Stage 1 machine archives (plus SHA256SUMS) and this target's Stage 1 Bun
  # hub executable without recompiling the backend or web UI. Only the Package
  # step receives the optional macOS Developer ID signing and notarization
  # secrets.
  desktop:
    needs: [archives]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, platform: mac, arch: arm64 }
          - { os: macos-26, platform: mac, arch: x64 }
          - { os: windows-2025, platform: win, arch: x64 }
          - { os: ubuntu-24.04, platform: linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: dist/archives
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ matrix.platform == 'win' }}
        with:
          name: hub-windows
          path: dist/hub-windows
      - name: Stage 2 build
        run: |
          slug=$(sed -n "s/^export const SLUG = '\(.*\)';$/\1/p" backend/shared/lib/brand.ts)
          export STAGE1_ARCHIVES=dist/archives
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            export STAGE1_HUB_EXE="dist/hub-windows/$slug-windows-amd64.exe"
          fi
          scripts/desktop.sh build
      - name: Package
        run: scripts/desktop.sh dist
        env:
          SKIP_BUILD: 1
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_SIGN_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_SIGN_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.MACOS_NOTARY_APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.MACOS_NOTARY_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_NOTARY_PASSWORD || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.exe
            dist/desktop/*.AppImage
            dist/desktop/*.deb
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs: [archives, desktop]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archives
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true
      - name: Checksums
        run: |
          slug=$(sed -n "s/^export const SLUG = '\(.*\)';$/\1/p" backend/shared/lib/brand.ts)
          cd dist/release
          shopt -s nullglob
          ls *.tar.gz *.dmg *.zip *.exe *.AppImage *.deb > ../assets
          {
            shasum -a 256 $(cat ../assets)
            for a in *.tar.gz; do
              n=${a%.tar.gz}
              echo "$(tar -xzf "$a" -O "$n/$slug" | shasum -a 256 | cut -d' ' -f1)  $n/$slug"
            done
          } > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: dist/release/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" $(sed 's|^|dist/release/|' dist/assets) dist/release/SHA256SUMS --notes-file notes.md --verify-tag
