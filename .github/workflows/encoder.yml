name: encoder

# Builds the video encoder of Linux machines (scripts/build-ffmpeg.sh) on
# native runners: when it changes, and for releases, which embed it.
on:
  pull_request:
    paths: ['scripts/build-ffmpeg.sh', 'scripts/encoder/**', '.github/workflows/encoder.yml']
  push:
    branches: [main]
    paths: ['scripts/build-ffmpeg.sh', 'scripts/encoder/**', '.github/workflows/encoder.yml']
  workflow_call:
    inputs:
      cache:
        description: Reuse the libraries built from the pinned sources (releases build them anew).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pinned sources and the libraries built from them; encoder.c is
      # compiled every time. Not for releases, which build everything.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # inputs.cache is empty outside workflow_call.
        if: ${{ format('{0}', inputs.cache) != 'false' }}
        with:
          path: |
            dist/ffmpeg/src
            dist/ffmpeg/build-${{ matrix.platform }}
          key: encoder-${{ matrix.platform }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - run: scripts/build-ffmpeg.sh
        env:
          FFMPEG_PLATFORMS: linux/${{ matrix.platform == 'linux-amd64' && 'amd64' || 'arm64' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encoder-${{ matrix.platform }}
          path: dist/ffmpeg/${{ matrix.platform }}/encoder.gz
          if-no-files-found: error
