name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            backend/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: make deps
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: make check
      - run: pnpm -C backend test
        env:
          EXTENDED_TESTS: 1
      - run: pnpm -C web test
        env:
          EXTENDED_TESTS: 1
      - run: pnpm -C desktop test
        env:
          EXTENDED_TESTS: 1

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: pnpm -C backend install --frozen-lockfile
      - name: Pinned terminal core and GUI helper
        run: |
          bun backend/scripts/fetch-hc.ts --exe "$RUNNER_TEMP/hc/herdr-core" "$(scripts/platform.sh --slash)"
          bun backend/scripts/fetch-deps.ts --only gui-helper
      - run: make it
        env:
          HC_TEST_BIN: ${{ runner.temp }}/hc/herdr-core

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            backend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Chromium and its system libraries
        run: pnpm -C e2e install --frozen-lockfile && pnpm -C e2e exec playwright install --with-deps --no-shell chromium
      - run: make e2e
        env:
          E2E_REQUIRE_DOCKER: 1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: dist/e2e/results

  # Stage 1 cross-compilation of all 6 POSIX archives + Windows hub executable.
  cross-compile:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            backend/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: make deps
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: scripts/build.sh
        env:
          WITH_WINDOWS: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-windows
          path: dist/*-windows-amd64.exe
          if-no-files-found: error

  # Stage 2 desktop tests and directory packaging on Linux, macOS and Windows,
  # consuming Stage 1's cross-compiled archives directly.
  desktop:
    needs: cross-compile
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            backend/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - if: runner.os == 'macOS'
        run: pnpm -C backend install --frozen-lockfile && pnpm -C backend test
        env:
          EXTENDED_TESTS: 1
      - if: runner.os == 'Windows'
        run: pnpm -C backend install --frozen-lockfile && pnpm -C backend test:hub
        env:
          EXTENDED_TESTS: 1
      - if: runner.os != 'Linux'
        run: |
          pnpm -C backend install --frozen-lockfile
          bun backend/scripts/fetch-deps.ts --only vt
          pnpm -C web install --frozen-lockfile && pnpm -C web test
        env:
          EXTENDED_TESTS: 1
      - run: pnpm -C desktop install --frozen-lockfile && pnpm -C desktop test
        env:
          EXTENDED_TESTS: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/archives
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'Windows'
        with:
          name: hub-windows
          path: dist/hub-windows
      - name: Package Stage 2 desktop app
        run: |
          slug=$(sed -n "s/^export const SLUG = '\(.*\)';$/\1/p" backend/shared/lib/brand.ts)
          export STAGE1_ARCHIVES=dist/archives
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export STAGE1_HUB_EXE="dist/hub-windows/$slug-windows-amd64.exe"
          fi
          scripts/desktop.sh app
