name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            backend/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: make deps
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # gofmt, vet, types, formatting, brand, flags, endpoints, notices,
      # generated files, the terminal emulator's digest and the shared test
      # vectors.
      - run: make check
      - run: go test -race ./...
      - run: pnpm -C backend test
      - run: pnpm -C web test
      - run: pnpm -C desktop test

  # The integration tests against a real terminal core: the pinned
  # herdr-core of internal/hcdist, fetched and verified as the build does,
  # driven by the machine build's packages and by the core's terminals.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: pnpm -C backend install --frozen-lockfile
      - name: Pinned terminal core
        run: go run ./scripts/fetch-hc -exe "$RUNNER_TEMP/hc/herdr-core" "$(go env GOOS)/$(go env GOARCH)"
      - run: make it
        env:
          HC_TEST_BIN: ${{ runner.temp }}/hc/herdr-core

  # The end-to-end tests (make e2e): the core with the pinned herdr-core
  # on isolated instances, the fake coding agents, Chromium, and SSH
  # machines in Docker containers.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            backend/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Chromium and its system libraries
        run: pnpm -C e2e install --frozen-lockfile && pnpm -C e2e exec playwright install --with-deps --no-shell chromium
      # The runner has Docker: the SSH machine tests must run, not skip.
      - run: make e2e
        env:
          E2E_REQUIRE_DOCKER: 1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: dist/e2e/results

  # The machine build's tests on macOS and Windows (the check job runs them
  # on Linux, with the race detector), the core's on macOS, the web UI's
  # and the shell's tests, and the Electron app packaged as a directory on
  # each system; the release workflow builds the installers.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            backend/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - if: runner.os != 'Linux'
        run: go test ./...
      # The core's tests include the machine side's, which runs on Linux
      # and macOS only.
      - if: runner.os == 'macOS'
        run: pnpm -C backend install --frozen-lockfile && pnpm -C backend test
      - if: runner.os != 'Linux'
        run: pnpm -C web install --frozen-lockfile && pnpm -C web test
      - run: pnpm -C desktop install --frozen-lockfile && pnpm -C desktop test
      - run: scripts/desktop.sh app

  cross-compile:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
            backend/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: make deps
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # The Windows core goes into the desktop installer only (no archive).
      - run: scripts/build.sh
        env:
          TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/release/*
