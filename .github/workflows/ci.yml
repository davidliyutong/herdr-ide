name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - run: make deps
      # gofmt, vet, types, formatting, brand, flags, notices, generated
      # files, the terminal emulator's digest and the shared test vectors.
      - run: make check
      - run: go test -race ./...
      - run: pnpm -C web test
      - run: pnpm -C desktop test
      - name: Web build keeps the go:embed placeholder
        run: pnpm -C web build && test -f web/dist/.gitkeep

  # The integration tests against a real terminal core: the pinned
  # herdr-core of internal/hcdist, fetched and verified as the build does.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Pinned terminal core
        run: go run ./scripts/fetch-hc -exe "$RUNNER_TEMP/hc/herdr-core" "$(go env GOOS)/$(go env GOARCH)"
      - run: make it
        env:
          HC_TEST_BIN: ${{ runner.temp }}/hc/herdr-core

  # The core's tests on macOS, the Electron app, and the macOS application:
  # its unit tests (with the renderer scripts/fetch-ghostty.sh pins) and the
  # ad-hoc signed bundle.
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      # Checks that the app packages; the release workflow publishes DMGs.
      - run: make desktop-app
      - run: brew install xcodegen
      - run: make macos-test
      # The core desktop-app built for this architecture goes into the bundle.
      - run: make macos-app
        env:
          SKIP_CORE: 1
      - name: Signature of the bundle
        run: codesign --verify --deep --strict --verbose=2 dist/macos/*.app

  cross-compile:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - run: make deps
      - run: scripts/build.sh
        env:
          TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/release/*
