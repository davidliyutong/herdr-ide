name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - run: make deps
      - run: make check
      - run: go test -race ./...
      - run: pnpm -C web test
      - run: pnpm -C desktop test
      - name: Web build keeps the go:embed placeholder
        run: pnpm -C web build && test -f web/dist/.gitkeep

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      # Checks that the app packages; the release workflow publishes DMGs.
      - run: make desktop-app

  cross-compile:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
            extensions/*/pnpm-lock.yaml
      - run: make deps
      - run: scripts/build.sh
        env:
          TARGETS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: dist/release/*
