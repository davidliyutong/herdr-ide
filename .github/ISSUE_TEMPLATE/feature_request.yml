name: Feature request / 功能建议
description: Propose an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 方案
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的其他方案
