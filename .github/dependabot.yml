version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /extensions/veldr-bridge
    schedule: { interval: weekly }
    groups:
      extension: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    groups:
      desktop: { patterns: ['*'] }
