# The Xcode project of the macOS application, generated by XcodeGen
# (scripts/macos-app.sh). The sources and the TermKit library are the Swift
# package's; Xcode builds them into an application bundle whose resources
# sit where code signing seals them. APP_NAME, APP_SLUG and APP_VERSION come
# from the script (internal/brand).
name: MacApp
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  MacApp:
    path: ..
  GhosttyKit:
    path: ../.deps/libghostty-spm
targets:
  App:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/App
      - path: ../../desktop/assets/icon.icns
        buildPhase: resources
    dependencies:
      - package: MacApp
        product: TermKit
      - package: GhosttyKit
        product: GhosttyTerminal
    settings:
      base:
        PRODUCT_NAME: ${APP_NAME}
        PRODUCT_BUNDLE_IDENTIFIER: dev.${APP_SLUG}.mac
        MARKETING_VERSION: ${APP_VERSION}
        CURRENT_PROJECT_VERSION: ${APP_VERSION}
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ${APP_NAME}
        INFOPLIST_KEY_CFBundleIconFile: icon
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_HARDENED_RUNTIME: YES
        # The script signs the finished bundle, with the core inside.
        CODE_SIGNING_ALLOWED: NO
        DEAD_CODE_STRIPPING: YES
schemes:
  App:
    build:
      targets:
        App: all
